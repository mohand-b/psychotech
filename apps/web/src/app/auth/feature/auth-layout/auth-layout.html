<div class="auth">
  <header class="auth__bar">
    <div class="auth__bar-inner">
      <a routerLink="/" class="auth__logo"
        >Psycho<span class="auth__logo-accent">Tech</span></a
      >
      <span class="flex-1"></span>
      @if (showLogout()) {
        <button type="button" class="auth__bar-logout" (click)="logout()">
          <ui-icon [img]="logoutIcon" [size]="15" [strokeWidth]="1.8" />
          Déconnexion
        </button>
      }
    </div>
  </header>

  <main class="auth__main">
    <router-outlet />
  </main>
</div>
