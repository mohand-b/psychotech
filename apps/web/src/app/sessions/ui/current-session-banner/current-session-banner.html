<div class="banner">
  <div class="banner__inner flex items-center gap-4">
    <div class="banner__info flex flex-col items-start gap-2">
      <span class="t-label">Session en cours</span>
      @if (isFull()) {
        <ui-chevron-stepper
          class="banner__stepper"
          variant="mini"
          [steps]="steps()"
        />
      } @else {
        <span class="banner__text flex items-center gap-2">
          <span class="banner__mode">{{ modeLabel() }}</span>
          @if (targetedAxis(); as axis) {
            <span class="banner__sep">·</span>
            <ui-axis-label [axis]="axis" />
          }
        </span>
      }
    </div>
    <div class="banner__compact flex flex-col items-start gap-1.5">
      <span class="banner__compact-title">Session en cours</span>
      @if (isFull()) {
        <ui-chevron-stepper variant="mini" [steps]="steps()" />
      } @else if (targetedAxis(); as axis) {
        <span class="banner__compact-meta flex items-center gap-2">
          <span class="banner__muted">Entraînement ciblé</span>
          <span class="banner__sep">·</span>
          <ui-axis-label [axis]="axis" />
        </span>
      }
    </div>
    <div class="banner__cta flex flex-col items-end gap-1">
      <ui-button
        class="banner__action"
        color="brand"
        [icon]="ctaIcon()"
        [attr.aria-label]="ctaLabel()"
        (click)="resumeRequested.emit()"
      >
        <span class="banner__action-label">{{ ctaLabel() }}</span>
      </ui-button>
    </div>
  </div>
</div>
