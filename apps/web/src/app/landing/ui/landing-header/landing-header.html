<header class="header" [class.header--glass]="scrolled()">
  <div class="header__inner">
    <a
      class="header__logo"
      [href]="buildSectionHref(section.hero)"
      [attr.aria-label]="siteName"
      >Psycho<span class="header__logo-accent">Tech</span></a
    >
    <nav class="header__nav" aria-label="Sections">
      <a class="header__link" [href]="buildSectionHref(section.story)"
        >Fonctionnement</a
      >
      <a class="header__link" [href]="buildSectionHref(section.axes)"
        >Les axes</a
      >
      <a class="header__link" [routerLink]="route.pricing">Tarifs</a>
      <a class="header__link" [href]="buildSectionHref(section.enterprise)"
        >Entreprises</a
      >
      <a class="header__link" [href]="buildSectionHref(section.faq)">FAQ</a>
    </nav>
    <div class="header__actions">
      @if (authenticated()) {
        <app-landing-button size="nav" [link]="dashboardLink"
          >Mon espace</app-landing-button
        >
      } @else {
        <a class="header__signin" [routerLink]="route.login">Connexion</a>
        <app-landing-button size="nav" [link]="signupLink"
          >Créer un compte</app-landing-button
        >
      }
    </div>
  </div>
</header>
