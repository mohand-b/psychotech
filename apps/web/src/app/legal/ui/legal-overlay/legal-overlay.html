@if (legalDocument(); as doc) {
  <div class="legal-overlay">
    <div class="legal-overlay__veil" (click)="close()" aria-hidden="true"></div>
    <div
      #panel
      class="legal-overlay__panel"
      role="dialog"
      (keydown)="trapFocus($event)"
      aria-modal="true"
      [attr.aria-label]="doc.title"
      tabindex="-1"
    >
      <header class="legal-overlay__head">
        <div class="legal-overlay__head-text">
          <h2 class="legal-overlay__title">{{ doc.title }}</h2>
          <span class="legal-overlay__updated"
            >Dernière mise à jour : {{ lastUpdated }}</span
          >
        </div>
        <button
          type="button"
          class="legal-overlay__close"
          aria-label="Fermer"
          (click)="close()"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </header>

      <div class="legal-overlay__body">
        <ui-legal-document [document]="doc" />
      </div>

      <footer class="legal-overlay__foot">
        <ui-button block="mobile" (click)="close()">J'ai compris</ui-button>
      </footer>
    </div>
  </div>
}
