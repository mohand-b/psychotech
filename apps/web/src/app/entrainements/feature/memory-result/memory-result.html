<ui-result-page>
  @if (page.result(); as r) {
    <ui-result-summary
      [axis]="r.axis"
      [score]="r.score"
      [previousBestScore]="r.previousBestScore"
      [bestScore]="r.bestScore"
      [isNewBest]="r.isNewBest"
      [isEqualBest]="r.isEqualBest"
      [sector]="r.sector"
      [completedAt]="r.completedAt"
      [referential]="page.referential()"
      [recordVisible]="!r.untimed"
      (revealDone)="page.celebration.releaseSceneHold()"
    />

    @if (scored(); as s) {
      <ui-result-panel>
        <ui-result-metrics panelStart [rows]="metricRows()" />
        <ui-result-timing
          panelEnd
          heading="Fiabilité par position"
          note="Taux de restitution correcte par position - toutes séquences confondues."
          (review)="navigateToCorrection()"
        >
          <ui-memory-reliability-chart
            [reliabilities]="s.positionReliability"
          />
        </ui-result-timing>
      </ui-result-panel>
    }
    @if (recommendations().length > 0) {
      <ui-result-recommendation
        [axis]="page.axis"
        [findings]="recommendations()"
      />
    }

    @if (page.celebration.announceView(); as announce) {
      <ui-badge-announce
        [view]="announce"
        (replay)="page.celebration.replayCelebration()"
      />
    }

    <ui-result-actions
      (newTraining)="page.navigateToAxisStart()"
      [backLabel]="page.backLabel"
      (back)="page.returnToAxesOrSessions()"
    />
  }
</ui-result-page>
