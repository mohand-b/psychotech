<ui-result-page>
  @if (result(); as r) {
  <ui-result-summary
    [axis]="r.axis"
    [score]="r.score"
    [previousBestScore]="r.previousBestScore"
    [bestScore]="r.bestScore"
    [isNewBest]="r.isNewBest"
    [isEqualBest]="r.isEqualBest"
    [sector]="r.sector"
    [completedAt]="r.completedAt"
    [referential]="referential()"
    [recordVisible]="!r.untimed"
    (revealDone)="celebration.sceneReady()"
  />

  @if (scored(); as s) {
  <ui-result-panel>
    <ui-result-metrics panelStart [rows]="metricRows()" />
    <ui-result-timing
      panelEnd
      heading="Fiabilité par position"
      note="Taux de restitution correcte par position - toutes séquences confondues."
      (review)="review()"
    >
      <ui-memory-reliability-chart [reliabilities]="s.positionReliability" />
    </ui-result-timing>
  </ui-result-panel>
  } @if (recommendations().length > 0) {
  <ui-result-recommendation [axis]="axis" [findings]="recommendations()" />
  }

  @if (celebration.announceView; as announce) {
  <ui-badge-announce [view]="announce" (replay)="celebration.replay()" />
  }

  <ui-result-actions
    (newTraining)="newTraining()"
    [backLabel]="backLabel"
    (back)="back()"
  />
  }
</ui-result-page>
