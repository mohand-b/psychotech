<section class="page-shell sim-brief">
  @if (loaded() && axis(); as currentAxis) {
  <ui-axis-briefing
    [axis]="currentAxis"
    [sector]="sector()"
    [showOptions]="false"
    [showPairing]="motricityAxis()"
  >
    @if (motricityAxis()) {
    <div briefingPairing class="sim-brief__pairing">
      <ui-gamepad-pairing
        variant="briefing"
        [pairing]="gamepadPairing()"
        [connected]="gamepadConnected()"
        [latency]="gamepadLatency()"
        [latencyGood]="gamepadLatencyGood()"
      />
    </div>
    }
  </ui-axis-briefing>

  <ui-action-footer>
    <ui-button
      [color]="buttonColor()"
      size="lg"
      relief="mobile"
      block="mobile"
      [showArrow]="true"
      (click)="start()"
    >
      Commencer l'axe
    </ui-button>
    <p actionFooterNote class="sim-brief__note">
      Le chronomètre démarre après le décompte.
    </p>
  </ui-action-footer>
  }
</section>
