<ui-result-page>
  @if (page.result(); as r) {
    <ui-result-summary
      [axis]="r.axis"
      [score]="r.score"
      [previousBestScore]="r.previousBestScore"
      [bestScore]="r.bestScore"
      [isNewBest]="r.isNewBest"
      [isEqualBest]="r.isEqualBest"
      [sector]="r.sector"
      [completedAt]="r.completedAt"
      [referential]="page.referential()"
      [recordVisible]="!r.untimed"
      (revealDone)="page.celebration.sceneReady()"
    />

    @if (metrics(); as m) {
      <ui-result-panel>
        <ui-result-metrics panelStart [rows]="metricRows()" />
        <ui-result-timing
          panelEnd
          heading="Maîtrise de trajectoire"
          note="Votre distance aux bords au fil de l'épreuve - 0 % au centre, 100 % au contact du bord. Les portions rouges sont les périodes hors couloir."
          [showReview]="false"
        >
          @if (hasTimeline()) {
            <ui-motricity-trajectory-chart [metrics]="m" />
          } @else {
            <div class="result__chart-empty">
              Données de trajectoire indisponibles pour cette session
            </div>
          }
        </ui-result-timing>
      </ui-result-panel>
    }
    @if (recommendations().length > 0) {
      <ui-result-recommendation
        [axis]="page.axis"
        [findings]="recommendations()"
      />
    }

    @if (page.celebration.announceView(); as announce) {
      <ui-badge-announce
        [view]="announce"
        (replay)="page.celebration.replay()"
      />
    }

    <ui-result-actions
      (newTraining)="page.newTraining()"
      [backLabel]="page.backLabel"
      (back)="page.back()"
    />
  }
</ui-result-page>
