<ui-result-page>
  @if (page.result(); as r) {
    <ui-result-summary
      [axis]="r.axis"
      [score]="r.score"
      [previousBestScore]="r.previousBestScore"
      [bestScore]="r.bestScore"
      [isNewBest]="r.isNewBest"
      [isEqualBest]="r.isEqualBest"
      [sector]="r.sector"
      [completedAt]="r.completedAt"
      [recordVisible]="recordVisible()"
      [referential]="page.referential()"
      (revealDone)="page.celebration.sceneReady()"
    />

    @if (scored()) {
      <ui-result-panel>
        <ui-result-metrics panelStart [rows]="metricRows()" />
        <ui-result-timing
          panelEnd
          heading="Gestion du temps"
          note="Hauteur = temps passé sur l'item, dans l'ordre de la session."
          (review)="review()"
        >
          <ui-time-chart
            [entries]="chartEntries()"
            [boundariesAfter]="familyBoundaries()"
          />
        </ui-result-timing>
        @if (families().length > 0) {
          <ui-result-family-bars panelFull [families]="families()" />
        }
      </ui-result-panel>
    }
    @if (recommendations().length > 0) {
      <ui-result-recommendation
        [axis]="page.axis"
        [findings]="recommendations()"
      />
    }

    @if (page.celebration.announceView(); as announce) {
      <ui-badge-announce
        [view]="announce"
        (replay)="page.celebration.replay()"
      />
    }

    <ui-result-actions
      (newTraining)="page.newTraining()"
      [backLabel]="page.backLabel"
      (back)="page.back()"
    />
  }
</ui-result-page>
