<div class="tri" [class.tri--four]="item().triangles.length === 4">
  <div class="tri__panel">
    <ng-content />
    <div class="tri__board">
      <ui-triangle-series
        [triangles]="item().triangles"
        [missing]="item().missing"
        [answerValue]="value()"
        [withArrows]="true"
      />
      @if (hint(); as hintText) {
        <ui-rule-hint
          #ruleHint
          [hint]="hintText"
          [used]="hintUsed()"
          [popWidth]="296"
          (opened)="hintOpened.emit()"
        />
      }
    </div>
  </div>

  <div class="tri__entry">
    <ui-logic-choices
      [choices]="choices()"
      [selectedIndex]="selectedIndex()"
      [disabled]="disabled()"
      (chosen)="chosen.emit($event)"
    />
    <span class="tri__help tri__help--desktop">A-D ou 1-4 pour répondre</span>
  </div>
</div>
